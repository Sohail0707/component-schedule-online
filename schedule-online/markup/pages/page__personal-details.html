<div class="page page__personal-details">
	<h1 class="page-heading">
		<span>please enter your details</span>
	</h1>

	<div class="customer-details--container">
		<div class="first-name--input-box input-box">
			<div class="input__error" aria-live="assertive"></div>

			<input class="first-name--input-field input-field" type="text" name="first-name" id="first-name" placeholder="John" />

			<label for="first-name">
				<span class="text">first name</span>
			</label>

			<icon name="excalmation"></icon>
			<icon name="checkmark_circle_outline"></icon>
		</div>

		<div class="last-name--input-box input-box">
			<div class="input__error" aria-live="assertive"></div>

			<input class="last-name--input-field input-field" type="text" name="last-name" id="last-name" placeholder="Smith" />

			<label for="last-name">
				<span class="text">last name</span>
			</label>

			<icon name="excalmation"></icon>
			<icon name="checkmark_circle_outline"></icon>
		</div>

		<div class="phone--input-box input-box">
			<div class="input__error" aria-live="assertive"></div>
			<diiv class="placeholder--value"></diiv>
			<input class="phone--input-field input-field" type="text" name="phone" id="phone" placeholder="1234567890" />

			<label for="phone">
				<span class="text">phone number</span>
			</label>

			<icon name="excalmation"></icon>
			<icon name="checkmark_circle_outline"></icon>
		</div>

		<div class="email--input-box input-box">
			<div class="input__error" aria-live="assertive"></div>

			<input class="email--input-field input-field" type="text" name="email" id="email" placeholder="example@abc.xyz" />

			<label for="email">
				<span class="text">email</span>
			</label>

			<icon name="excalmation"></icon>
			<icon name="checkmark_circle_outline"></icon>
		</div>

		<div class="note--input-box input-box">
			<div class="input__error" aria-live="assertive"></div>

			<textarea
				class="note--input-field input-field"
				type="text"
				name="note"
				id="note"
				placeholder="Extra detail that you want us to know"
			></textarea>

			<label for="note">
				<span class="text">notes (optional)</span>
			</label>

			<icon name="excalmation"></icon>
			<icon name="checkmark_circle_outline"></icon>
		</div>
	</div>
</div>
