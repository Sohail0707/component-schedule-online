<div class="page page__card-details">
	<h1 class="page-heading">
		<span>please enter your credit card details</span>
	</h1>
	<div class="card-details--container">
		<div class="card-details__input--container">
			<div class="card-number--input-box input-box">
				<div class="input__error" aria-live="assertive"></div>
				<diiv class="placeholder--value"></diiv>
				<input class="card-number--input-field input-field" type="text" name="card-number" id="card-number" placeholder="xxxx xxxx xxxx xxxx" />

				<label for="card-number">
					<span class="text">credit card number</span>
				</label>

				<icon name="excalmation"></icon>
				<icon name="checkmark_circle_outline"></icon>
			</div>

			<div class="expiration--input-box input-box">
				<div class="input__error" aria-live="assertive"></div>
				<diiv class="placeholder--value"></diiv>
				<input class="expiration--input-field input-field" type="text" name="expiration" id="expiration" placeholder="MMYY or MMYYYY" />

				<label for="expiration">
					<span class="text">expiration</span>
				</label>

				<icon name="excalmation"></icon>
				<icon name="checkmark_circle_outline"></icon>
			</div>

			<div class="cvc--input-box input-box">
				<div class="input__error" aria-live="assertive"></div>
				<input class="cvc--input-field input-field" type="text" name="cvc" id="cvc" placeholder="123 1234 12345" />

				<label for="cvc">
					<span class="text">CVC</span>
				</label>

				<icon name="excalmation"></icon>
				<icon name="checkmark_circle_outline"></icon>
			</div>

			<div class="zipcode--input-box input-box">
				<div class="input__error" aria-live="assertive"></div>
				<input class="zipcode--input-field input-field" type="text" name="zipcode" id="zipcode" placeholder="12345 12345-6789" />

				<label for="zipcode">
					<span class="text">billing zipcode</span>
				</label>

				<icon name="excalmation"></icon>
				<icon name="checkmark_circle_outline"></icon>
			</div>
		</div>

		<div class="card-details__terms--container">
			<p class="card-details--terms">The card will not be charged until after service is complete.</p>
			<p class="card-details--terms">We never disclose any information of our customer.</p>
		</div>

		<h2 class="heading">We proudly accept</h2>
		<div class="card-details__icon--container">
			<img src="/schedule-online/assets/visa.svg" alt="" class="card-details--icon" />
			<img src="/schedule-online/assets/mastercard.svg" alt="" class="card-details--icon" />
			<img src="/schedule-online/assets/amex.svg" alt="" class="card-details--icon" />
			<img src="/schedule-online/assets/discover.svg" alt="" class="card-details--icon" />
		</div>
	</div>
</div>
