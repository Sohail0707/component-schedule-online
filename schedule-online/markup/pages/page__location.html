<div class="page page__location">
	<h1 class="page-heading">
		<span>enter the address where you want us to come</span>
	</h1>
	<div class="location--container">
		<div class="selected-item--container">
			<label class="selected-item--label">service:</label>
			<p class="selected-item--name">Premium 270.00 3.5Hrs. (approx)</p>
			<label class="selected-item--label">location:</label>
			<p class="selected-item--name">2021 K St NW, Washington, DC 20006, USA</p>
		</div>

		<div class="location--input-box input-box">
			<div class="input__error" aria-live="assertive"></div>
			<div class="input-box--loading-spinner"></div>
			<input
				class="location--input-field input-field"
				type="text"
				name="address"
				id="address"
				placeholder="Ex- 2021 K Street Northwest, Washington, DC, USA"
			/>

			<label for="address">
				<span class="text">address</span>
			</label>

			<icon name="excalmation"></icon>
			<icon name="checkmark_circle_outline"></icon>
		</div>
		<ul class="location__prediction--list">
			<!-- Here, the location list will be placed by the JavaScript getting form the google map API based on the users input into the input field -->
		</ul>
	</div>
</div>
